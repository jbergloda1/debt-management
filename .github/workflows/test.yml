name: Test

# Deploy do Vercel lo (tự build mỗi lần push). Workflow này chạy toàn bộ test,
# kể cả E2E mà bản build trên Vercel không chạy được (cần Chrome).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc -p .
      - run: npm test
      # E2E dùng Chrome có sẵn trên runner (channel: 'chrome')
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
